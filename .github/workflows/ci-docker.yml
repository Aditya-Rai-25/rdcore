name: CI (Docker)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  docker-compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      RADIUSDESK_VOLUME: ${{ github.workspace }}/.ci/radiusdesk
      RADIUSDESK_NETWORK: radiusdesk-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap MariaDB (same as local_build.sh)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RADIUSDESK_VOLUME}/db_startup" "${RADIUSDESK_VOLUME}/db_conf"
          chmod -R 777 "${RADIUSDESK_VOLUME}"

          cp cake4/rd_cake/setup/db/rd.sql "${RADIUSDESK_VOLUME}/db_startup/"
          cp cake4/rd_cake/setup/db/8.*.sql "${RADIUSDESK_VOLUME}/db_startup/" || true
          cp cake4/rd_cake/setup/db/optional/*.sql "${RADIUSDESK_VOLUME}/db_startup/" || true
          cp cake4/rd_cake/setup/db/mysql_sharding/*.sql "${RADIUSDESK_VOLUME}/db_startup/" || true

          cp docker/db_priveleges.sql "${RADIUSDESK_VOLUME}/db_startup/"
          cp docker/startup.sh "${RADIUSDESK_VOLUME}/db_startup/"
          cp docker/my_custom.cnf "${RADIUSDESK_VOLUME}/db_conf/"

          docker network create --attachable -d bridge "${RADIUSDESK_NETWORK}" >/dev/null 2>&1 || true

          cd docker
          docker compose up -d rdmariadb

          echo "Waiting for MariaDB to accept connections..."
          for i in {1..90}; do
            if docker exec radiusdesk-mariadb sh -lc 'command -v mariadb-admin >/dev/null 2>&1 && mariadb-admin ping -uroot --silent || mysqladmin ping -uroot --silent' >/dev/null 2>&1; then
              break
            fi
            sleep 2
            if [[ "${i}" == "90" ]]; then
              echo "MariaDB did not become ready in time" >&2
              docker logs --tail=200 radiusdesk-mariadb || true
              exit 1
            fi
          done

          docker exec -u 0 radiusdesk-mariadb /tmp/startup.sh
          docker exec radiusdesk-mariadb mariadb -uroot -e "SHOW DATABASES LIKE 'rd';" | grep -q rd

      - name: Build and start radiusdesk (docker-compose.yml)
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          docker compose build radiusdesk
          docker compose up -d radiusdesk

      - name: Verify services and FreeRADIUS config
        shell: bash
        run: |
          set -euo pipefail
          echo "Supervisor status:"
          docker exec radiusdesk supervisorctl status

          status_out="$(docker exec radiusdesk supervisorctl status)"
          echo "${status_out}" | grep -q "nginx"
          echo "${status_out}" | grep -q "php-fpm"
          echo "${status_out}" | grep -q "init_and_freeradius"

          echo "Validate FreeRADIUS config:"
          docker exec radiusdesk freeradius -XC

          echo "Verify key RadiusDesk tables exist:"
          docker exec radiusdesk-mariadb mariadb -uroot -e "
          SELECT table_name FROM information_schema.tables
          WHERE table_schema='rd'
          AND table_name IN (
            'dynamic_clients',
            'dynamic_client_settings',
            'permanent_users',
            'realm_ssids',
            'realm_pmks',
            'radpostauth'
          )
          ORDER BY table_name;
          " | tee /tmp/rd_tables.txt
          grep -q "dynamic_clients" /tmp/rd_tables.txt

      - name: Install RADIUS test tools
        shell: bash
        run: |
          set -euo pipefail
          docker exec radiusdesk bash -lc 'command -v radclient >/dev/null 2>&1 || (apt-get update && apt-get install -y freeradius-utils)'

      - name: RADIUS smoke test (auth)
        shell: bash
        run: |
          set -euo pipefail
          docker exec radiusdesk bash -lc 'cat > /tmp/auth.req <<'"'"'EOF'"'"'
          User-Name = "dev@dev"
          User-Password = "testing123"
          NAS-IP-Address = 127.0.0.1
          EOF'
          docker exec radiusdesk bash -lc 'timeout 15 radclient -x 127.0.0.1:1812 auth testing123 < /tmp/auth.req | tee /tmp/auth.out'
          docker exec radiusdesk bash -lc 'grep -E "Received Access-Accept" /tmp/auth.out'

      - name: RADIUS smoke test (accounting)
        shell: bash
        run: |
          set -euo pipefail
          docker exec radiusdesk bash -lc 'cat > /tmp/acct.req <<'"'"'EOF'"'"'
          User-Name = "test"
          Acct-Status-Type = Start
          NAS-IP-Address = 127.0.0.1
          EOF'
          docker exec radiusdesk bash -lc 'timeout 15 radclient -x 127.0.0.1:1813 acct testing123 < /tmp/acct.req | tee /tmp/acct.out'
          docker exec radiusdesk bash -lc 'grep -E "Received Accounting-Response" /tmp/acct.out'

      - name: Dump logs on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          docker ps -a || true
          docker logs --tail=300 radiusdesk || true
          docker logs --tail=300 radiusdesk-mariadb || true
